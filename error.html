<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--card-bg);
      color: var(--text-main);
      margin: 0;
      padding: 1.5rem;
      width: 260px;
      text-align: center;
    }
    .icon {
      background: #fee2e2;
      color: #ef4444;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 0.75rem;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5V14m0 3.247v-.5m-6.02-5.985C8.608 5.587 9.92 3 12 3s3.393 2.587 6.02 7.762l.327.644c2.182 4.3 3.274 6.45 2.287 8.022C19.648 21 17.208 21 12.327 21h-.654c-4.88 0-7.321 0-8.307-1.572s.105-3.722 2.287-8.022z"/></svg>
  </div>
  <h1>Cannot Scrape</h1>
  <p>Chrome restricts extensions on system pages and the Web Store.</p>
</body>
</html>
