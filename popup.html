<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalScrape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-root">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
            <rect x="11" y="2" width="7" height="7" rx="1.5" fill="white" opacity="0.6"/>
            <rect x="2" y="11" width="7" height="7" rx="1.5" fill="white" opacity="0.6"/>
            <rect x="11" y="11" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-name">LocalScrape</span>
          <span class="logo-tag">Visual Web Scraper</span>
        </div>
      </div>
      <div id="status-badge" class="status-badge idle">Idle</div>
    </header>

    <!-- Main Content -->
    <main class="main">

      <!-- Instructions Card -->
      <div id="instructions-card" class="card instructions-card">
        <div class="instruction-step">
          <div class="step-num">1</div>
          <p>Click <strong>Start Scraping</strong> below</p>
        </div>
        <div class="instruction-step">
          <div class="step-num">2</div>
          <p>Hover over page elements to highlight them</p>
        </div>
        <div class="instruction-step">
          <div class="step-num">3</div>
          <p>Click an element to extract all similar items</p>
        </div>
        <div class="instruction-step">
          <div class="step-num">4</div>
          <p>Choose <strong>CSV</strong> or <strong>JSON</strong> and download</p>
        </div>
      </div>

      <!-- Results Card (hidden initially) -->
      <div id="results-card" class="card results-card hidden">
        <div class="results-header">
          <span class="results-icon">✦</span>
          <div class="results-meta">
            <span id="results-count" class="results-count">0 items</span>
            <span id="results-selector" class="results-selector">—</span>
          </div>
        </div>
        <div id="results-preview" class="results-preview"></div>
      </div>

      <!-- Export Format Toggle -->
      <div id="export-section" class="export-section hidden">
        <label class="section-label">Export Format</label>
        <div class="format-toggle">
          <button id="btn-csv" class="format-btn active" aria-pressed="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><line x1="1" y1="5" x2="13" y2="5" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="5" x2="5" y2="13" stroke="currentColor" stroke-width="1.2"/></svg>
            CSV
          </button>
          <button id="btn-json" class="format-btn" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 2C2.9 2 2 2.9 2 4v1.5c0 .8-.7 1.5-1.5 1.5S.5 6.3.5 7v0c0 .7.7 1.5 1.5 1.5V10c0 1.1.9 2 2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 2c1.1 0 2 .9 2 2v1.5c0 .8.7 1.5 1.5 1.5S15 6.3 15 7v0c0 .7-.7 1.5-1.5 1.5V10c0 1.1-.9 2-2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            JSON
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="btn-start" class="btn btn-primary">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 5.5L10.5 8L6.5 10.5V5.5Z" fill="currentColor"/></svg>
          Start Scraping
        </button>

        <button id="btn-stop" class="btn btn-danger hidden">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="5.5" width="5" height="5" rx="1" fill="currentColor"/></svg>
          Stop
        </button>

        <button id="btn-download" class="btn btn-success hidden">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0l-3-3m3 3l3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11v1.5A1.5 1.5 0 004.5 14h7a1.5 1.5 0 001.5-1.5V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Download
        </button>

        <button id="btn-clear" class="btn btn-ghost hidden">Clear & Restart</button>
      </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>100% local &bull; No data leaves your browser</span>
      <a id="btn-sponsor" class="sponsor-link" href="https://github.com/sponsors/SajadTroy" target="_blank" rel="noopener noreferrer">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 13.7C7.7 13.7 7.4 13.6 7.2 13.4L2.1 8.3C1 7.2 1 5.4 2.1 4.3C2.6 3.8 3.3 3.5 4 3.5C4.7 3.5 5.4 3.8 5.9 4.3L8 6.4L10.1 4.3C10.6 3.8 11.3 3.5 12 3.5C12.7 3.5 13.4 3.8 13.9 4.3C15 5.4 15 7.2 13.9 8.3L8.8 13.4C8.6 13.6 8.3 13.7 8 13.7Z"/>
        </svg>
        Support on GitHub
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
